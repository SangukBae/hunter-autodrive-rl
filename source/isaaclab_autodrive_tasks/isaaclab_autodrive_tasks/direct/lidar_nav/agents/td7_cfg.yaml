# TD7 하이퍼파라미터 — LiDAR Navigation (Phase D)
# observation_dim: 82  (80 LiDAR sectors + goal_dist + goal_angle)
# action_dim: 2        (linear_vel, angular_vel)

# ── 네트워크 ─────────────────────────────────────────────────────────────────
hidden_dim: 256
latent_dim: 256

# ── TD7 파라미터 ─────────────────────────────────────────────────────────────
actor_lr: 3.0e-4
critic_lr: 3.0e-4
discount: 0.99
tau: 0.005
policy_noise: 0.2
noise_clip: 0.5
policy_freq: 2

# ── Checkpointing ─────────────────────────────────────────────────────────────
reset_weight: 0.9
steps_before_checkpointing: 40000
max_eps_when_checkpointing: 50

# ── LAP PER (TD7 기본 활성) ───────────────────────────────────────────────────
prioritized: true

# ── 리플레이 버퍼 ─────────────────────────────────────────────────────────────
buffer_size: 1000000
batch_size: 256

# ── 학습 스케줄 ───────────────────────────────────────────────────────────────
total_timesteps: 1000000
warmup_steps: 10000
eval_interval: 10000
eval_episodes: 10
max_episode_steps: 3000

seed: 0
