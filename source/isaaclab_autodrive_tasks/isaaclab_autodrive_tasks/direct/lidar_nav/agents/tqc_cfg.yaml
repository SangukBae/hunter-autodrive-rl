# TQC 하이퍼파라미터 — LiDAR Navigation (Phase D)
# observation_dim: 82  (80 LiDAR sectors + goal_dist + goal_angle)
# action_dim: 2        (linear_vel, angular_vel)

# ── 네트워크 ─────────────────────────────────────────────────────────────────
actor_hdim: 256
critic_hdim: 256
actor_activ: relu
critic_activ: elu

# ── TQC 파라미터 ─────────────────────────────────────────────────────────────
n_critics: 5
n_quantiles: 25
top_quantiles_to_drop_per_net: 2

# ── 학습 파라미터 ─────────────────────────────────────────────────────────────
actor_lr: 3.0e-4
critic_lr: 3.0e-4
ent_coef_lr: 3.0e-4
discount: 0.99
tau: 0.005
target_entropy: -2.0       # -action_dim
ent_coef: "auto_1.0"

# ── 리플레이 버퍼 ─────────────────────────────────────────────────────────────
prioritized: false
buffer_size: 1000000
batch_size: 256

# ── 학습 스케줄 ───────────────────────────────────────────────────────────────
total_timesteps: 1000000
warmup_steps: 10000
eval_interval: 10000
eval_episodes: 10
max_episode_steps: 3000

seed: 0
