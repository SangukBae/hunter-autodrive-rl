# Hunter SE 경로 추종 TD7 하이퍼파라미터
# 원본 출처: drl_agent/config/hyperparameters_td7.yaml

algorithm: td7
experiment_name: hunter_path_tracking_td7

# 재현성
seed: 0

# 학습 스케줄
total_timesteps: 1_000_000
warmup_steps: 25_000        # 랜덤 행동으로 버퍼 채우기
eval_interval: 5_000
eval_episodes: 10
max_episode_steps: 2000     # 200s / 0.1s

# 리플레이 버퍼 (LAP PER 기본 활성화)
buffer_size: 1_000_000
batch_size: 256
prioritized: true           # LAP PER 활성화

# 학습률
actor_lr: 3.0e-4
critic_lr: 3.0e-4

# TD3 기반 설정
discount: 0.99
tau: 0.005
policy_noise: 0.2           # 탐색 노이즈 표준편차
noise_clip: 0.5             # 노이즈 클리핑 범위
policy_freq: 2              # Actor 업데이트 주기 (delayed policy update)

# 네트워크 구조
hidden_dim: 256
latent_dim: 256             # SALE 임베딩 차원

# Checkpointing (성능 후퇴 방지)
reset_weight: 0.9                    # checkpoint 복원 혼합 비율
steps_before_checkpointing: 40_000   # checkpointing 시작 스텝
max_eps_when_checkpointing: 50       # checkpoint 갱신 최대 에피소드 간격
